# Deterministic patterns the retro tracks across windows. See
# ~/claudes-home/docs/superpowers/specs/2026-09-07-retro-pattern-metrics-design.md
#
# detector  — Python regex applied to each tool-result error text
# eligible  — which sessions count in the denominator: isolated | ran_bash | any
# remedies  — kata refs; `landed` is used only when the ref does not resolve in kata
# remedies refs are claudes-home kata issues; for a remedy tracked anywhere else, use landed = "YYYY-MM-DD"

[[pattern]]
name = "worktree-guard-shape"
detector = "(?s)^(?!.*working directory resolved to the shared checkout).*isolated in the worktree"
eligible = "isolated"
# 59jn (closed 2026-10-07): the 2.1.284/.285 false positives (rhgit substring, heredocs) no longer fire on
# 2.1.293 (live probe). A computed $VAR operand still refuses by design; the guard text names the fix
# (-- before it) and the coach now relays it. No changelog entry 2.1.283..2.1.293 explains the split.
remedies = [{ ref = "8j5h" }, { ref = "jhby" }, { ref = "59jn" }, { ref = "super-do@retro-2026-10-24-C2", landed = "2026-10-24" }]

[[pattern]]
name = "worktree-cwd-trap"
detector = "working directory resolved to the shared checkout"
eligible = "isolated"
remedies = [{ ref = "8j5h" }]

[[pattern]]
name = "sleep-block"
detector = "Blocked: sleep \\d+ followed by"
eligible = "ran_bash"
remedies = []

[[pattern]]
name = "eval-eq-error"
detector = "\\(eval\\):\\d+: == not found"
eligible = "ran_bash"
# ~/.zshrc: [[ -n "$CLAUDECODE" ]] && unsetopt EQUALS — retro 2026-09-08 C4
remedies = [{ ref = "33sm" }]

[[pattern]]
name = "zsh-nomatch"
detector = "no matches found: --(include|exclude)"
eligible = "ran_bash"
# my-env zshrc: [[ -n "$CLAUDECODE" ]] && unsetopt NOMATCH — retro 2026-09-23 C2 (20ce19f24c19)
remedies = [{ ref = "my-env@20ce19f24c19", landed = "2026-09-23" }]

[[pattern]]
name = "classifier-denial"
detector = "denied by the Claude Code auto mode classifier"
eligible = "any"
# self-matches sessions that read this file (retro 2026-09-08 C3, kata kt3x)
remedies = [{ ref = "kt3x" }]

[[pattern]]
name = "sigpipe-141"
detector = "^Exit code 141\\b"
eligible = "ran_bash"
# PIPE_FAIL (retro 2026-10-07 C5) makes `cmd | head` exit 141; the output is complete but reads as a failure.
# Remedy: talktomegoose and super-do say never trim with head/tail, never pipe kata mutations (retro 2026-10-24 C1).
remedies = [{ ref = "talktomegoose@retro-2026-10-24-C1", landed = "2026-10-24" }]
